name: Deploy Hermes to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Deploy and restart Hermes
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            bash -s -- "$DEPLOY_PATH" <<'REMOTE'
          set -e

          deploy_step() {
            local label="$1"
            shift
            local log
            log="$(mktemp)"
            if "$@" >"$log" 2>&1; then
              rm -f "$log"
              printf '%s: ok\n' "$label"
            else
              printf '%s: failed\n' "$label" >&2
              cat "$log" >&2
              rm -f "$log"
              return 1
            fi
          }

          export PATH="$HOME/.bun/bin:$PATH"
          cd "$1"
          deploy_step "sync" git pull --ff-only origin main
          deploy_step "install" bun install --frozen-lockfile
          deploy_step "test" bun test apps/server/test
          deploy_step "types" bun run check-types
          deploy_step "build" bun run build
          cd apps/server
          deploy_step "restart" bm2 restart hermes-gateway
          deploy_step "save" bm2 save

          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:3000/health >/dev/null; then
              echo "health: ok"
              exit 0
            fi
            sleep 1
          done

          echo "health: failed" >&2
          bm2 list >&2 || true
          exit 1
          REMOTE
