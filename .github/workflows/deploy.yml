name: Deploy Hermes to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Deploy and restart Hermes
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -e
             export PATH=\"\$HOME/.bun/bin:\$PATH\"
             cd \"$DEPLOY_PATH\"
             git pull --ff-only origin main
             bun install --frozen-lockfile
             bun test
             bun run check-types
             bun run build
             cd apps/server
             bm2 restart hermes-gateway
             bm2 save
             for attempt in $(seq 1 20); do
               if curl --fail --silent --show-error http://127.0.0.1:3000/health; then
                 echo
                 echo \"Deployment successful\"
                 exit 0
               fi
               sleep 1
             done
             echo \"Hermes did not become healthy after restart\" >&2
             exit 1"
